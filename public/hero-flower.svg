<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 140" fill="none">
  <!-- Simple stitched flower for the homepage hero's top-left corner (the
       top-right copy is the same file mirrored with CSS). Grayscale only. -->
  <defs>
    <g id="petal">
      <path d="M0 -8C11 -14 15 -30 0 -38C-15 -30 -11 -14 0 -8Z" fill="#f4f4f4" stroke="#a3a3a3" stroke-width="1.4" stroke-linejoin="round"/>
      <path d="M0 -13V-32" stroke="#c4c4c4" stroke-width="1.1" stroke-linecap="round"/>
    </g>
  </defs>

  <!-- stem + leaf, running stitch -->
  <path d="M52 62C58 84 78 102 106 114" stroke="#a8a8a8" stroke-width="1.8" stroke-dasharray="6 3" stroke-linecap="round"/>
  <path d="M74 92C82 76 100 72 112 78C104 92 88 98 74 92Z" fill="#f4f4f4" stroke="#a3a3a3" stroke-width="1.4" stroke-linejoin="round"/>
  <path d="M77 90C88 84 100 80 108 79" stroke="#c4c4c4" stroke-width="1.1" stroke-linecap="round"/>

  <!-- flower -->
  <g transform="translate(46 46)">
    <use href="#petal"/>
    <use href="#petal" transform="rotate(72)"/>
    <use href="#petal" transform="rotate(144)"/>
    <use href="#petal" transform="rotate(216)"/>
    <use href="#petal" transform="rotate(288)"/>
    <circle r="8" fill="#e6e6e6" stroke="#9a9a9a" stroke-width="1.3"/>
    <g fill="#9a9a9a">
      <circle cx="-2.6" cy="-1.6" r="1.5"/>
      <circle cx="2.6" cy="-1.6" r="1.5"/>
      <circle cx="0" cy="2.6" r="1.5"/>
    </g>
  </g>
</svg>
