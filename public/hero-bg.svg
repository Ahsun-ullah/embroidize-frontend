<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 760" preserveAspectRatio="xMidYMid slice">
  <!-- Homepage hero backdrop: linen fabric with small machine-embroidery
       accessories (needles, hoops, spools, cones, bobbins, snips, seam
       rippers, pins) scattered like a pattern. Everything is kept small so
       the hero copy and card stay the focus. Grayscale only (brand is black
       & white). -->
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.55" stop-color="#f6f6f6"/>
      <stop offset="1" stop-color="#ededed"/>
    </linearGradient>
    <pattern id="linen" width="7" height="7" patternUnits="userSpaceOnUse">
      <path d="M0 3.5h7M3.5 0v7" stroke="#000" stroke-opacity="0.022" stroke-width="1"/>
    </pattern>
    <radialGradient id="glowLeft" cx="0.27" cy="0.5" r="0.3">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>

    <!-- machine needle: point left, eye near the point, shank right -->
    <g id="mneedle">
      <path d="M0 4L78 1.6V6.4Z" fill="#d0d0d0"/>
      <path d="M78 1.6H84V6.4H78Z" fill="#d4d4d4"/>
      <rect x="84" y="0" width="38" height="8" rx="2" fill="#e2e2e2" stroke="#d0d0d0" stroke-width="1.2"/>
      <ellipse cx="14" cy="4" rx="4" ry="1" fill="#ffffff"/>
    </g>
    <!-- thread cone -->
    <g id="cone">
      <path d="M-30 0L-15 -150H15L30 0Z" fill="#eeeeee" stroke="#d3d3d3" stroke-width="2.4"/>
      <path d="M-27 -20H27M-25 -40H25M-23 -60H23M-21 -80H21M-19 -100H19M-17 -120H17M-16 -138H16" stroke="#dfdfdf" stroke-width="1.8"/>
      <rect x="-9" y="-164" width="18" height="16" rx="3" fill="#e9e9e9" stroke="#d1d1d1" stroke-width="2"/>
      <ellipse cx="0" cy="0" rx="30" ry="6" fill="#f0f0f0" stroke="#d3d3d3" stroke-width="2"/>
    </g>
    <!-- thread spool -->
    <g id="spool">
      <rect x="-24" y="-66" width="48" height="10" rx="3" fill="#ebebeb" stroke="#d0d0d0" stroke-width="1.8"/>
      <rect x="-18" y="-56" width="36" height="50" fill="#ededed" stroke="#d3d3d3" stroke-width="1.6"/>
      <path d="M-18 -48H18M-18 -40H18M-18 -32H18M-18 -24H18M-18 -16H18" stroke="#dddddd" stroke-width="1.4"/>
      <rect x="-24" y="-6" width="48" height="10" rx="3" fill="#ebebeb" stroke="#d0d0d0" stroke-width="1.8"/>
    </g>
    <!-- bobbin -->
    <g id="bobbin">
      <circle r="22" fill="#f0f0f0" stroke="#d0d0d0" stroke-width="2.2"/>
      <circle r="16" fill="#efefef" stroke="#d9d9d9" stroke-width="1.4"/>
      <circle r="10" fill="none" stroke="#dcdcdc" stroke-width="1.4"/>
      <circle r="4.5" fill="#ffffff" stroke="#d0d0d0" stroke-width="1.6"/>
    </g>
    <!-- embroidery snips -->
    <g id="snips">
      <path d="M-9 -12L5 -92L1 -12Z" fill="#e0e0e0" stroke="#cdcdcd" stroke-width="1.8" stroke-linejoin="round"/>
      <path d="M9 -12L-5 -92L-1 -12Z" fill="#e9e9e9" stroke="#cdcdcd" stroke-width="1.8" stroke-linejoin="round"/>
      <circle cx="0" cy="-30" r="3.4" fill="#cdcdcd"/>
      <circle cx="-15" cy="4" r="13" fill="none" stroke="#cdcdcd" stroke-width="4.5"/>
      <circle cx="15" cy="4" r="13" fill="none" stroke="#cdcdcd" stroke-width="4.5"/>
    </g>
    <!-- seam ripper -->
    <g id="ripper">
      <rect x="0" y="-8" width="92" height="16" rx="8" fill="#eeeeee" stroke="#d0d0d0" stroke-width="1.8"/>
      <path d="M12 -8V8M20 -8V8" stroke="#d9d9d9" stroke-width="1.4"/>
      <rect x="92" y="-4" width="12" height="8" rx="2" fill="#e2e2e2" stroke="#d0d0d0" stroke-width="1.4"/>
      <path d="M104 0H138" stroke="#cecece" stroke-width="2.8"/>
      <path d="M138 0C146 -2 150 -8 152 -14M138 0C146 2 148 4 149 8" fill="none" stroke="#cecece" stroke-width="2.6" stroke-linecap="round"/>
      <circle cx="150" cy="8" r="3.6" fill="#d3d3d3"/>
    </g>
    <!-- round hoop -->
    <g id="roundhoop">
      <circle r="62" fill="#ffffff" fill-opacity="0.6"/>
      <circle r="62" fill="none" stroke="#e0e0e0" stroke-width="10"/>
      <circle r="55" fill="none" stroke="#d3d3d3" stroke-width="2"/>
      <rect x="-9" y="-80" width="18" height="16" rx="3" fill="#e9e9e9" stroke="#d0d0d0" stroke-width="1.8"/>
      <rect x="-4" y="-88" width="8" height="9" rx="2" fill="#d3d3d3"/>
      <path d="M-24 14C-10 -16 12 -16 24 14" fill="none" stroke="#d9d9d9" stroke-width="2.4" stroke-dasharray="6 5"/>
    </g>
    <!-- machine embroidery hoop (rectangular, with mounting brackets) -->
    <g id="mhoop">
      <rect x="-104" y="-18" width="26" height="36" rx="6" fill="#ececec" stroke="#d3d3d3" stroke-width="2.4"/>
      <rect x="78" y="-18" width="26" height="36" rx="6" fill="#ececec" stroke="#d3d3d3" stroke-width="2.4"/>
      <rect x="-80" y="-60" width="160" height="120" rx="24" fill="#ffffff" fill-opacity="0.6"/>
      <rect x="-80" y="-60" width="160" height="120" rx="24" fill="none" stroke="#e0e0e0" stroke-width="9"/>
      <rect x="-72" y="-52" width="144" height="104" rx="17" fill="none" stroke="#d3d3d3" stroke-width="2"/>
      <path d="M-62 0h12M50 0h12M0 -44v10M0 34v10" stroke="#d9d9d9" stroke-width="2"/>
    </g>
    <!-- pin -->
    <g id="pin">
      <path d="M0 0L58 0" stroke="#d0d0d0" stroke-width="2" stroke-linecap="round"/>
      <circle cx="60" cy="0" r="5.5" fill="#d3d3d3"/>
    </g>
  </defs>

  <rect width="1920" height="760" fill="url(#base)"/>
  <rect width="1920" height="760" fill="url(#linen)"/>

  <!-- running stitches -->
  <g fill="none" stroke-linecap="round">
    <path d="M-40 668C260 600 520 738 880 668S1420 508 1960 588" stroke="#e6e6e6" stroke-width="2" stroke-dasharray="14 10"/>
    <path d="M-40 96C220 40 460 150 760 88S1300 30 1960 92" stroke="#eaeaea" stroke-width="1.8" stroke-dasharray="12 9"/>
  </g>

  <!-- scattered accessories (all scaled down) -->
  <!-- left -->
  <use href="#ripper" transform="translate(60 380) rotate(18) scale(0.5)"/>
  <use href="#cone" transform="translate(220 712) scale(0.42)"/>
  <use href="#mhoop" transform="translate(150 540) rotate(-8) scale(0.42)"/>
  <use href="#spool" transform="translate(540 150) rotate(12) scale(0.5)"/>

  <!-- centre -->
  <use href="#mneedle" transform="translate(960 220) rotate(-32) scale(0.55)"/>
  <use href="#mhoop" transform="translate(1040 480) rotate(6) scale(0.4)"/>
  <use href="#roundhoop" transform="translate(900 690) scale(0.42)"/>

  <!-- right -->
  <use href="#mneedle" transform="translate(1210 44) rotate(-6) scale(0.6)"/>
  <use href="#snips" transform="translate(1580 400) rotate(40) scale(0.5)"/>
  <use href="#roundhoop" transform="translate(1780 300) scale(0.5)"/>
  <use href="#spool" transform="translate(1400 730) scale(0.5)"/>
  <use href="#cone" transform="translate(1700 724) scale(0.4)"/>


  <!-- soft light behind the heading so the copy stays readable -->
  <rect width="1920" height="760" fill="url(#glowLeft)"/>
</svg>
